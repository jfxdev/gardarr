<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Media and torrent management" />
    
    <!-- PWA Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gardarr" />
    <!-- iOS keeps Home Screen icons aggressively cached. Version the URL so a
         newly installed or reinstalled PWA always receives Gardarr's icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260830" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon.png?v=20260830" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>Gardarr</title>
    <script>
      // Apply dark theme and color variant immediately to prevent flash
      (function() {
        const theme = localStorage.getItem('theme');
        const isDark = theme ? theme === 'dark' : true; // Default to dark
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
        
        // Apply color variant
        const colorVariant = localStorage.getItem('app_color_variant') || 'default';
        document.documentElement.setAttribute('data-color-variant', colorVariant);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
